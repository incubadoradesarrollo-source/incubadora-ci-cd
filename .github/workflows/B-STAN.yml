name: Pipeline De Backend STAN

on:
  workflow_call:
    inputs:
      image_name:
        description: "Imagen GHCR sin ghcr.io/"
        required: true
        type: string

      image_tag:
        description: "Tag del entorno: development o production"
        required: true
        type: string

      python_version:
        required: false
        type: string
        default: "3.14"

      dockerfile:
        required: false
        type: string
        default: "./Dockerfile"

    secrets:
      coolify_webhook:
        required: true

      coolify_token:
        required: true

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: django-insecure-ci
      COOKIE_SECURE: "True"
      EMAIL_HOST_USER: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ inputs.image_tag }}-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy ${{ inputs.image_tag }} in Coolify
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Validate configuration
        env:
          COOLIFY_WEBHOOK: ${{ secrets.coolify_webhook }}
          COOLIFY_TOKEN: ${{ secrets.coolify_token }}
        run: |
          test -n "$COOLIFY_WEBHOOK" || {
            echo "ERROR: COOLIFY_WEBHOOK is not configured"
            exit 1
          }

          test -n "$COOLIFY_TOKEN" || {
            echo "ERROR: COOLIFY_TOKEN is not configured"
            exit 1
          }

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.coolify_webhook }}
          COOLIFY_TOKEN: ${{ secrets.coolify_token }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

          echo "Coolify deployment triggered successfully."