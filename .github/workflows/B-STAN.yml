name: Pipeline De Backend STAN

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.14"
      dockerfile:
        required: false
        type: string
        default: "./Dockerfile"
      healthcheck_url:
        required: true
        type: string
      dast_target_url:
        required: false
        type: string
        default: ""
      load_test_file:
        required: false
        type: string
        default: "tests/load/k6-script.js"
      run_load_tests:
        required: false
        type: boolean
        default: false
      minimum_coverage:
        required: false
        type: number
        default: 0

    secrets:
      coolify_webhook:
        required: true
      coolify_token:
        required: true
      sonar_host_url:
        required: false
      sonar_token:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  fast-checks:
    name: "Phase 1 - Quality & Secret Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

  test:
    name: "Phase 2 - Django Tests & Coverage"
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 20

    env:
      SECRET_KEY: django-insecure-ci
      COOKIE_SECURE: "True"
      EMAIL_HOST_USER: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Validate Django configuration
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run --branch manage.py test
          coverage xml -o coverage.xml
          coverage report --fail-under=${{ inputs.minimum_coverage }}

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  sonar:
    name: "Phase 3 - SonarQube Quality Gate"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    env:
      SONAR_TOKEN: ${{ secrets.sonar_token }}
      SONAR_HOST_URL: ${{ secrets.sonar_host_url }}

    steps:
      - name: Sonar not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube no configurado."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Run SonarQube analysis
        id: sonar_scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >-
            -Dsonar.projectKey=b-stan
            -Dsonar.projectName=B-STAN
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/tests/**,**/.venv/**,**/venv/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: Create or update SonarQube issue
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_RESULT: ${{ steps.sonar_scan.outcome }}
          SONAR_URL: ${{ secrets.sonar_host_url }}
        run: |
          TITLE="[Quality] SonarQube B-STAN Quality Gate"
          BODY="## SonarQube Quality Gate

          **Resultado:** \`$SONAR_RESULT\`

          Revisa el reporte completo en: $SONAR_URL/dashboard?id=b-stan

          Commit analizado: \`${{ github.sha }}\`"

          NUMBER="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail if SonarQube failed
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && steps.sonar_scan.outcome == 'failure' }}
        run: exit 1

  dependency-security:
    name: "Phase 3 - Dependency Security"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          cache: "false"

      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs.json
          retention-days: 30

      - name: Create or update Trivy dependency issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-fs.json)"
          TITLE="[Security] Trivy dependencies B-STAN"
          ROWS="$(jq -r '
            [.Results[]?.Vulnerabilities[]?] |
            .[] |
            "- \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "sin fix") | \(.Severity) | \(.VulnerabilityID)"
          ' trivy-fs.json)"

          BODY="## Trivy: dependencias e infraestructura

          Hallazgos HIGH/CRITICAL: **$COUNT**

          $ROWS

          Artifact: \`trivy-filesystem-report\`
          Commit: \`${{ github.sha }}\`"

          NUMBER="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  docker:
    name: "Phase 4 - Build, Scan & Publish Image"
    runs-on: ubuntu-latest
    needs: [sonar, dependency-security]
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      issues: write

    env:
      IMAGE: ghcr.io/${{ inputs.image_name }}
      MUTABLE_TAG: ${{ inputs.image_tag }}
      IMMUTABLE_TAG: ${{ inputs.image_tag }}-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.MUTABLE_TAG }}
            ${{ env.IMAGE }}:${{ env.IMMUTABLE_TAG }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMMUTABLE_TAG }}
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: "0"
          cache: "false"

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 30

      - name: Create or update container security issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image.json)"
          TITLE="[Security] Trivy image ${{ inputs.image_tag }} B-STAN"
          ROWS="$(jq -r '
            [.Results[]?.Vulnerabilities[]?] |
            .[] |
            "- \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "sin fix") | \(.Severity) | \(.VulnerabilityID)"
          ' trivy-image.json)"

          BODY="## Trivy: imagen Docker

          Imagen: \`${IMAGE}:${IMMUTABLE_TAG}\`
          Hallazgos HIGH/CRITICAL: **$COUNT**

          $ROWS

          Artifact: \`trivy-image-report\`
          Commit: \`${{ github.sha }}\`"

          NUMBER="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Block publication if image has vulnerabilities
        run: |
          COUNT="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image.json)"
          test "$COUNT" -eq 0

      - name: Publish validated image
        run: |
          docker push "$IMAGE:$MUTABLE_TAG"
          docker push "$IMAGE:$IMMUTABLE_TAG"

  deploy:
    name: "Phase 5 - Deploy ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.coolify_webhook }}
          COOLIFY_TOKEN: ${{ secrets.coolify_token }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Wait for API health check
        env:
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$HEALTHCHECK_URL" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  dast-and-performance:
    name: "Phase 6 - DAST & Load Tests"
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ inputs.image_tag == 'development' && inputs.dast_target_url != '' }}
    timeout-minutes: 25

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nuclei
        uses: projectdiscovery/nuclei-action@v3
        with:
          version: v3.11.1
          install-only: true
          cache: true

      - name: Prepare DAST report
        run: |
          mkdir -p reports
          : > reports/nuclei.jsonl

      - name: Run Nuclei DAST
        id: nuclei
        continue-on-error: true
        env:
          DAST_TARGET_URL: ${{ inputs.dast_target_url }}
        run: |
          set +e

          timeout --signal=TERM --kill-after=30s 15m \
            nuclei \
              -u "$DAST_TARGET_URL" \
              -tags exposure,misconfig,headers \
              -severity medium,high,critical \
              -rl 3 \
              -c 1 \
              -timeout 8 \
              -retries 0 \
              -ni \
              -omit-raw \
              -jsonl-export reports/nuclei.jsonl \
              -silent

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "status=timed_out_after_15_minutes" >> "$GITHUB_OUTPUT"
            echo "Nuclei alcanzó el límite interno de 15 minutos."
            exit 0
          fi

          echo "status=failed_exit_code_$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Upload Nuclei report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-dast-report
          path: reports/nuclei.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Create or update Nuclei issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUCLEI_STATUS: ${{ steps.nuclei.outputs.status }}
          DAST_TARGET_URL: ${{ inputs.dast_target_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          COUNT="$(wc -l < reports/nuclei.jsonl | tr -d ' ')"

          ROWS="$(
            jq -r '
              [
                .["template-id"],
                (.info.severity // "unknown"),
                (.info.name // "Unnamed finding")
              ] | "- `\(.[0])` | \(.[1]) | \(.[2])"
            ' reports/nuclei.jsonl 2>/dev/null | sed -n '1,50p'
          )"

          if [ -z "$ROWS" ]; then
            ROWS="Sin hallazgos reportados."
          fi

          TITLE="[Security] Nuclei DAST B-STAN Development"
          BODY="## Nuclei DAST

          Objetivo: \`$DAST_TARGET_URL\`
          Estado: **${NUCLEI_STATUS:-not_started}**
          Hallazgos: **$COUNT**

          ### Primeros hallazgos

          $ROWS

          Artifact: \`nuclei-dast-report\`
          Commit: \`$COMMIT_SHA\`"

          NUMBER="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Run k6 load test
        id: k6
        if: ${{ inputs.run_load_tests }}
        continue-on-error: true
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ${{ inputs.load_test_file }}
        env:
          TARGET_URL: ${{ inputs.dast_target_url }}

      - name: Create or update k6 issue
        if: ${{ inputs.run_load_tests }}
        env:
          GH_TOKEN: ${{ github.token }}
          K6_RESULT: ${{ steps.k6.outcome }}
        run: |
          TITLE="[Performance] k6 B-STAN Development"
          BODY="## k6 Load Test

          Objetivo: \`${{ inputs.dast_target_url }}\`
          Resultado: **$K6_RESULT**
          Commit: \`${{ github.sha }}\`"

          NUMBER="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail if k6 failed
        if: ${{ inputs.run_load_tests && steps.k6.outcome == 'failure' }}
        run: exit 1